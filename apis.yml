name: Digital Mortar
description: Digital Mortar is an in-store and physical-location people-journey analytics
  company. Its DM1 platform measures shopper and visitor journeys - path, queue, occupancy,
  throughput, dwell and space utilization - using LiDAR and stereoscopic-camera sensors,
  delivering heat mapping, funnel analysis, real-time queue and occupancy tracking, display
  and merchandising measurement, and door/people counting as a SaaS analytics tool. It
  serves retail, airports, malls, stadiums and events. Digital Mortar is now part of PMY
  Group; its digitalmortar.com domain is dormant (mail-only, no live website) and it
  exposes no public developer or API program.
